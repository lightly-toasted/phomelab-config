---
caddy_enabled: true
caddy_package: github:lightly-toasted/phomelab-config#caddy # caddy with cloudflare plugin

caddy_caddyfile: |
  {
    http_port {{ caddy_http_port }}
    https_port {{ caddy_https_port }}
    acme_dns cloudflare {env.CF_API_TOKEN}
  }



  glances.ts.700457.xyz {
    # Glances
    reverse_proxy http://localhost:61208
  }

  {{ paperless_ngx_hostname }} {
    # Paperless-ngx
    reverse_proxy http://localhost:{{ paperless_ngx_port }}
  }

  restic.ts.700457.xyz {
    # restic rest-server
    reverse_proxy http://localhost:{{ restic_rest_server_port }}
  }

  music.ts.700457.xyz {
    # Navidrome
    reverse_proxy http://localhost:{{ navidrome_port }}
  }

  chat.ts.700457.xyz {
    # Open WebUI
