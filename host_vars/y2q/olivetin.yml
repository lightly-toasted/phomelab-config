---
olivetin_enabled: true

olivetin_config:
  authRequireGuestsToLogin: true
  
  accessControlLists:
    - name: "admins"
      addToEveryAction: true
      matchUsergroups:
        - "admins"
      permissions:
        view: true
        exec: true
        logs: true

  authLocalUsers:
    enabled: true
    users:
      - username: toast
        usergroup: admins
        password: $argon2id$v=19$m=65536,t=4,p=6$MS4p5TJWo7YvChCA8bvdQQ$9t/XwMouHZtHlPSLU/5fnv9dNmHBC5djUf0P6pBiOKs

  actions:
    - title: "Ping Google"
      icon: "🌐"
      shell: ping -c 3 8.8.8.8
      popupOnStart: execution-dialog-stdout-only

    - title: "Check Disk Space"
      icon: "💾"
      shell: df -h
      popupOnStart: execution-dialog-stdout-only
